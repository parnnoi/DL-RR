[project]
name = "rr"
version = "0.1.0"
description = "Reproduction of DAF:re anime character recognition (arXiv:2101.08674)"
readme = "README.md"
authors = [
    { name = "ParnNoi", email = "pltv.parnleetv@gmail.com" }
]
# The paper's code (Animesion) used Python 3.8.5.
requires-python = ">=3.8,<3.9"
dependencies = [
    # The paper used PyTorch 1.7 (CUDA 10.2), which supports neither Apple Silicon
    # nor RTX 40-series GPUs. 1.13.1 is the oldest release that runs on both.
    "torch==1.13.1",
    "torchvision==0.14.1",
    # Linux: the exact versions pinned by Animesion (requirements_conda.txt).
    "numpy==1.19.2; sys_platform == 'linux'",
    "pandas==1.1.3; sys_platform == 'linux'",
    "pillow==8.0.1; sys_platform == 'linux'",
    "matplotlib==3.3.2; sys_platform == 'linux'",
    # macOS (Apple Silicon): the oldest versions that ship arm64 wheels.
    "numpy==1.21.0; sys_platform == 'darwin'",
    "pandas==1.4.0; sys_platform == 'darwin'",
    "pillow==8.4.0; sys_platform == 'darwin'",
    "matplotlib==3.5.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["ipykernel"]

[project.scripts]
rr = "rr:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
